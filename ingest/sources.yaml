# Nyaaya AI — Hybrid RAG statute sources
#
# Each entry describes one act on IndiaCode. `act_uuid` is the DSpace item UUID
# (used in URLs like /act/<act_uuid>/sections). `act_id` is the internal
# identifier used in Discover API filters (dc.identifier.act_id).
#
# To add a new act:
#   1. Find it on https://indiacode.gov.in/home
#   2. Open its sections page — copy the UUID from the URL
#   3. Open DevTools → Network → filter "discover" — copy the act_id from the
#      f.act_id query param
#   4. Add an entry below, then re-run scrape.py

